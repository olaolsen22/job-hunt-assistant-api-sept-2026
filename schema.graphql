schema {
  query: Query
  mutation: Mutation
}

type Query {
  listingParsePrompt: ListingParsePrompt! @cost(weight: "10")
  listingQuickParsePrompt: ListingParsePrompt! @cost(weight: "10")
  llmCallLimits: [LlmCallLimit!]! @cost(weight: "10")
  companyParsePrompt: CompanyParsePrompt! @cost(weight: "10")
  companies(
    search: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: CompanyFilterInput @cost(weight: "10")
    order: [CompanySortInput!] @cost(weight: "10")
  ): CompaniesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  coverLetterDraft(listingId: Int!): CoverLetterDraft @cost(weight: "10")
  coverLetterDraftFromProfile(listingId: Int!): CoverLetterContent
    @cost(weight: "10")
  coverLetterExternalPrompt(listingId: Int!): CoverLetterExternalPrompt!
    @cost(weight: "10")
  dashboardLayout: [DashboardWidgetState!]! @cost(weight: "10")
  industries(
    search: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: IndustryFilterInput @cost(weight: "10")
    order: [IndustrySortInput!] @cost(weight: "10")
  ): IndustriesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  jobRoleCategories(
    search: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: JobRoleCategoryFilterInput @cost(weight: "10")
    order: [JobRoleCategorySortInput!] @cost(weight: "10")
  ): JobRoleCategoriesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  jobRoles(
    search: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: JobRoleFilterInput @cost(weight: "10")
    order: [JobRoleSortInput!] @cost(weight: "10")
  ): JobRolesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  checkListingUrls(urls: [String!]!): [ListingUrlCheckResult!]!
    @cost(weight: "10")
  listings(
    skip: Int
    take: Int
    archived: Boolean! = false
    dueWithinDays: Int
    search: String
    isTrainingProgram: Boolean
    where: ListingFilterInput @cost(weight: "10")
    order: [ListingSortInput!] @cost(weight: "10")
  ): ListingsCollectionSegment
    @listSize(
      assumedSize: 100
      slicingArguments: ["take"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["items"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  listingById(id: Int!): Listing @cost(weight: "10")
  llmModels: LlmModels! @cost(weight: "10")
  providerKeys(includeRetired: Boolean! = false): [ProviderKeyStatus!]!
    @cost(weight: "10")
