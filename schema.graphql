interface Error {
  message: String!
}

union CreateListingError = InvalidListingError | InvalidLocationError

union DeleteDocumentError = DocumentNotFoundError | DocumentSentError

union DeleteListingError = ListingNotFoundError | ListingInUseError

union SaveLocationError = InvalidLocationError

union SetDocumentSentError = DocumentNotFoundError

union SetListingArchivedError = ListingNotFoundError

union SetListingFavoriteError = ListingNotFoundError

union UpdateCompanyError =
  | CompanyNotFoundError
  | InvalidCompanyError
  | InvalidLocationError

union UpdateListingError =
  | ListingNotFoundError
  | InvalidListingError
  | InvalidLocationError

union UploadDocumentError = ListingNotFoundError | InvalidDocumentError

