  ): SkillCategoriesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  skillCleanupPrompt: SkillCleanupPrompt! @cost(weight: "10")
  skills(
    search: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: SkillFilterInput @cost(weight: "10")
    order: [SkillSortInput!] @cost(weight: "10")
  ): SkillsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  tailoredCvDraftFromProfile(listingId: Int!): TailoredCvContent
    @cost(weight: "10")
  tailoredCvDraft(listingId: Int!): TailoredCvDraft @cost(weight: "10")
  tailoredCvExternalPrompt(listingId: Int!): TailoredCvExternalPrompt!
    @cost(weight: "10")
  llmUsageToday: UsageToday! @cost(weight: "10")
  usageDaily(days: Int! = 30, credentialId: String): [DailyUsage!]!
    @cost(weight: "10")
  writingSamples(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: WritingSampleFilterInput @cost(weight: "10")
    order: [WritingSampleSortInput!] @cost(weight: "10")
  ): WritingSamplesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
}

