schema {
  query: Query
  mutation: Mutation
}

type Query {
  listingParsePrompt: ListingParsePrompt! @cost(weight: "10")
  companies(
    search: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: CompanyFilterInput @cost(weight: "10")
    order: [CompanySortInput!] @cost(weight: "10")
  ): CompaniesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  jobRoles(
    search: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: JobRoleFilterInput @cost(weight: "10")
    order: [JobRoleSortInput!] @cost(weight: "10")
  ): JobRolesConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  listings(
    skip: Int
    take: Int
    archived: Boolean! = false
    where: ListingFilterInput @cost(weight: "10")
    order: [ListingSortInput!] @cost(weight: "10")
  ): ListingsCollectionSegment
    @listSize(
      assumedSize: 100
      slicingArguments: ["take"]
      slicingArgumentDefaultValue: 20
      sizedFields: ["items"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  listingById(id: Int!): Listing @cost(weight: "10")
  locations(
    search: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: LocationFilterInput @cost(weight: "10")
    order: [LocationSortInput!] @cost(weight: "10")
  ): LocationsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  skills(
    search: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: SkillFilterInput @cost(weight: "10")
    order: [SkillSortInput!] @cost(weight: "10")
  ): SkillsConnection
    @listSize(
      assumedSize: 50
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 10
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
}

type Mutation {
  uploadDocument(input: UploadDocumentInput!): UploadDocumentPayload!
    @cost(weight: "10")
  setDocumentSent(input: SetDocumentSentInput!): SetDocumentSentPayload!
    @cost(weight: "10")
  deleteDocument(input: DeleteDocumentInput!): DeleteDocumentPayload!
    @cost(weight: "10")
  updateCompany(input: UpdateCompanyInput!): UpdateCompanyPayload!
    @cost(weight: "10")
  createListing(input: CreateListingInput!): CreateListingPayload!
    @cost(weight: "10")
  updateListing(input: UpdateListingInput!): UpdateListingPayload!
    @cost(weight: "10")
  setListingFavorite(input: SetListingFavoriteInput!): SetListingFavoritePayload!
    @cost(weight: "10")
  setListingArchived(input: SetListingArchivedInput!): SetListingArchivedPayload!
    @cost(weight: "10")
  deleteListing(input: DeleteListingInput!): DeleteListingPayload!
    @cost(weight: "10")
  saveLocation(input: SaveLocationInput!): SaveLocationPayload!
    @cost(weight: "10")
}

"Information about the offset pagination."
type CollectionSegmentInfo {
  "Indicates whether more items exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more items exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
}

"A connection to a list of items."
type CompaniesConnection {
  "Information to aid in pagination."
  pageInfo: PageInfo!
  "A list of edges."
  edges: [CompaniesEdge!]
  "A flattened list of the nodes."
  nodes: [Company!]
  "Identifies the total count of items in the connection."
  totalCount: Int! @cost(weight: "10")
}

"An edge in a connection."
type CompaniesEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: Company!
}

type Company {
  listingCount: Int! @cost(weight: "10")
  id: Int!
  name: String!
  locationId: Int
  location: Location
}

type CompanyNotFoundError implements Error {
  message: String!
}

type CreateListingPayload {
  listing: Listing
  errors: [CreateListingError!]
}

type DeleteDocumentPayload {
  id: Int
  errors: [DeleteDocumentError!]
}

type DeleteListingPayload {
  id: Int
  errors: [DeleteListingError!]
}

